[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "market-research-core"
version = "0.1.0"
description = "Fail-closed market-data access for reproducible research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "pyarrow>=14"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
market-data = "market_research_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

