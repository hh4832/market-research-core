[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "market-research-core"
version = "0.2.0"
description = "Fail-closed unified market data and reproducible backtests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "pyarrow>=14", "pandas-market-calendars==5.5.0", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
